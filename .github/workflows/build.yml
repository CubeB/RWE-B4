name: Build
on:
  push:
    branches: [master, gh-actions, revival]
    # A change to prose does not need eight machines to agree about it.
    # Anything touching code, shaders, the build or the workflow itself
    # still builds -- a commit only skips if every file in it is listed
    # here.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master, revival]
    # `labeled` is here only so that adding ci:full re-runs CI without
    # needing an empty push behind it. Every job then asks which label it
    # was, so no other label costs anything: the run is created and every
    # job in it is skipped.
    types: [opened, synchronize, reopened, labeled]
    # A change to prose does not need eight machines to agree about it.
    # Anything touching code, shaders, the build or the workflow itself
    # still builds -- a commit only skips if every file in it is listed
    # here.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
  # release.yml calls this on a tag, where no path filter applies.
  workflow_call:

# Read-only unless a job says otherwise: the release and nightly jobs ask for
# contents: write themselves, and no other job needs to write anything with
# the token. Issue #75.
permissions:
  contents: read

# A pull request only needs its newest commit checked, and a branch push only
# needs its newest push. Tags are exempt: a release run must not be cancelled
# by anything, and each tag has its own ref anyway.
#
# A label gets a group of its own, per label name, and that is not tidiness.
# Opening a pull request and labelling it -- which CLAUDE.md asks for twice,
# under Contributing and again under Labels, both times in the same breath as
# opening it -- fires `opened` and then `labeled` seconds apart. With one group for the ref, the second run cancelled the
# first: "Canceling since a higher priority waiting request for
# Build-refs/pull/177/merge exists". The survivor was the `labeled` run, whose
# every job asks whether the label was ci:full and skips when it was not, so
# the pull request ended up with a green tick and nothing built behind it.
# Pull requests #177 to #183 were all merged that way. Per label name rather
# than one "label" group, because adding a second label would otherwise cancel
# the ci:full run somebody had just asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'main' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The launcher is platform-independent, so it is checked once here rather
  # than three times over inside the build jobs. Those still run `npm ci` and
  # `npm run package` where CPack needs the packaged launcher, but they no
  # longer repeat the type check, the tests and the lint.
  launcher:
    # `labeled` is in the trigger list so that adding ci:full re-runs CI without
    # needing an empty push behind it. Any other label should not.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: install node.js
        uses: actions/setup-node@v6
        with:
          # 22, not 18: 18 left support in April 2025, and the refreshed
          # toolchain asks for more than it has -- eslint 9 wants 18.18+,
          # jest 30 wants 18.14+, and webpack-dev-server 6 wants 22.15+,
          # which npm reports as a warning rather than a failure and so
          # would have been found at run time.
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: install npm packages
        working-directory: launcher
        run: npm ci
      - name: test launcher
        working-directory: launcher
        run: |
          npm run tsc
          npm test
          npm run lint
      # A webpack config can break while every type still checks: a loader
      # that no longer exists under the name the config gives it is not a
      # type error. All three bundles, because there are three configs.
      - name: build launcher bundles
        working-directory: launcher
        run: npm run build:all:prod

  # MSVC puts the class key into the decorated name, so `struct Foo;` against
  # `class Foo { ... };` is two types to its linker and an unresolved external
  # to nobody else. gcc and clang are entitled to ignore the difference and
  # do, which is what made it a thirty-minute round trip through the Windows
  # jobs to learn about -- see tools/class-key.sh. It needs no build and no
  # submodules, so it gets a runner of its own and answers in seconds, beside
  # those jobs rather than behind them.
  class-keys:
    # `labeled` is in the trigger list so that adding ci:full re-runs CI without
    # needing an empty push behind it. Any other label should not.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: class keys
        run: ./tools/class-key.sh src

  # A pull request builds one configuration -- Linux gcc-14 Debug, which is
  # the one that runs the test suite with asserts live. Everything else waits
  # for the merge to revival, or for a `ci:full` label on the pull request.
  build-linux:
    # `labeled` is in the trigger list so that adding ci:full re-runs CI without
    # needing an empty push behind it. Any other label should not.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    # A job that hangs should fail in a reasonable time rather than
    # hold a runner for GitHub's six-hour default: on 2026-09-06 a
    # modal assertion dialog in the MSVC Debug test run sat for two
    # hours and eighteen minutes before it was cancelled by hand.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '[{"configuration":"Debug","cc":"gcc-14","cxx":"g++-14"},{"configuration":"Release","cc":"gcc-14","cxx":"g++-14"},{"configuration":"Debug","cc":"clang-18","cxx":"clang++-18"},{"configuration":"Release","cc":"clang-18","cxx":"clang++-18"}]' || '[{"configuration":"Debug","cc":"gcc-14","cxx":"g++-14"}]') }}
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: init submodules (shallow)
        run: git submodule update --init --recursive --depth 1
      # The runner image ships apt sources for Google Chrome and Microsoft
      # that nothing here installs from -- everything in the next step comes
      # out of Ubuntu's own archive. On 2026-09-09 Google published a
      # Packages.gz whose hash did not match the one in its own Release file,
      # `apt-get update` exited 100, and all four Linux jobs went down with it
      # while nothing in the repository had changed. They are removed rather
      # than left able to fail the build, and the update retries transient
      # fetch errors on the sources that are left.
      - name: update apt package list
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update -y -o Acquire::Retries=3
      # SDL3's windowing and GL backends are built from the submodule and
      # need these headers; libglew-dev used to pull them in transitively.
      - name: install apt packages
        run: sudo apt-get install -y -o Acquire::Retries=3
          gcc-14
          g++-14
          clang-18
          ccache
          imagemagick
          libgl-dev
          libglx-dev
          libegl-dev
          libx11-dev
          zlib1g-dev
          libpng-dev
          libasound2-dev
          libpulse-dev
          libpipewire-0.3-dev
          libwayland-dev
          wayland-protocols
          libxkbcommon-dev
          libdecor-0-dev
          xvfb
      - name: restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ env.CC }}-${{ matrix.configuration }}-
      # `git rev-parse HEAD:libs/protobuf` is the gitlink SHA the superproject
      # records, so it names the exact protobuf the build is about to compile.
      # It is read here rather than hashed with hashFiles, whose globs do not
      # reliably descend into .git -- a miss there returns an empty string and
      # collapses the key to a constant without saying so.
      - name: identify protobuf version
        id: protobuf-version
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:libs/protobuf)" >> "$GITHUB_OUTPUT"
      - name: restore protobuf
        id: cache-protobuf-restore
        uses: actions/cache/restore@v5
        with:
          path: libs/_protobuf-install
          key: ${{ runner.os }}-${{ env.CC }}-protobuf-${{ steps.protobuf-version.outputs.sha }}-${{ hashFiles('libs/build-protobuf.sh') }}
      - name: build protobuf
        working-directory: libs
        run: ./build-protobuf.sh
      - name: save protobuf
        id: cache-protobuf-save
        if: steps.cache-protobuf-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: libs/_protobuf-install
          key: ${{ steps.cache-protobuf-restore.outputs.cache-primary-key }}
      - name: build rwe
        run: |
          mkdir build
          pushd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
          make -j 4
          popd
      - name: test rwe
        env:
          RWE_TEST_ANNOUNCE: 1
        run: ./build/rwe_test --durations yes
      # The scenarios drive the real GameScene, which needs a GL context even
      # though it draws nothing, so they run under Xvfb. They also need Total
      # Annihilation's game data, which is not redistributable and is not on
      # the runner: set the RWE_SCENARIO_DATA repository variable to a data
      # directory (a self-hosted runner, or a cache step) to switch them on.
      # With it unset the step prints that it is skipping, so a green job never
      # stands in for a check that did not happen.
      - name: run scenarios
        env:
          SCENARIO_DATA: ${{ vars.RWE_SCENARIO_DATA }}
          SDL_AUDIODRIVER: dummy
          XDG_RUNTIME_DIR: /tmp/rwe-xdg
        run: |
          if [ -z "$SCENARIO_DATA" ]; then
            echo "RWE_SCENARIO_DATA is not set; skipping the scenario runner."
            exit 0
          fi
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 600 xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./build/scenario --all --data-path "$SCENARIO_DATA"
      # Two peers on loopback plus a computer player, and then a run that
      # drops one peer part way through, both comparing their RWE_HASH_LOG
      # tick for tick. Needs the same game data as the scenarios, so it skips
      # with them rather than standing in for a check that did not happen.
      # The script is Python-standard-library only, so plain python3 runs it.
      - name: run net-test
        env:
          SCENARIO_DATA: ${{ vars.RWE_SCENARIO_DATA }}
          SDL_AUDIODRIVER: dummy
          XDG_RUNTIME_DIR: /tmp/rwe-xdg
        run: |
          if [ -z "$SCENARIO_DATA" ]; then
            echo "RWE_SCENARIO_DATA is not set; skipping the net-test."
            exit 0
          fi
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          timeout 300 python3 tools/net-test.py --ai --seconds 30 --data-path "$SCENARIO_DATA"
          timeout 300 python3 tools/net-test.py --peers 3 --kill 2 --seconds 30 --data-path "$SCENARIO_DATA"
      - name: build AppImage
        if: matrix.cc == 'gcc-14' && matrix.configuration == 'Release'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/rwe
          cp build/rwe build/rwe_bridge build/rwe_setup AppDir/usr/bin/
          cp -r shaders AppDir/usr/share/rwe/
          cp LICENSE README.md AppDir/usr/share/rwe/

          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/rwe.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Robot War Engine
          Exec=rwe
          Icon=rwe
          Categories=Game;StrategyGame;
          DESKTOP
          sed -i 's/^          //' AppDir/usr/share/applications/rwe.desktop

          # Placeholder icon (required by linuxdeploy). ImageMagick 7 renamed
          # `convert` to `magick`, and the ubuntu-24.04 image ships neither by
          # default, so the package is installed above and both spellings are
          # accepted here.
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          "$IM" -size 256x256 xc:'#2a4a6b' -fill white -gravity center \
            -pointsize 72 -annotate 0 'RWE' \
            AppDir/usr/share/icons/hicolor/256x256/apps/rwe.png

          # A tagged release and its checksum, not `continuous`: that build is
          # replaced in place, and the tool runs with the release's files in
          # reach. To move to a newer one, change the tag and the hash
          # together. Issue #75.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage

          VERSION=$(git describe --tags --always)
          export VERSION
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/rwe.desktop \
            --custom-apprun cmake/AppRun \
            --output appimage

      # cmake/AppRun deliberately sets no LD_LIBRARY_PATH: that variable is
      # inherited by every child process, and the bundled libpng reaching the
      # host's zenity through it killed every error dialog the engine has
      # (issue #232). What replaces it is the rpath linuxdeploy patches into
      # each binary, so that rpath is now load-bearing -- if it ever stops
      # being written the AppImage would not start at all, for anybody. This
      # fails the build instead of shipping that.
      - name: the AppImage binaries must carry an rpath
        if: matrix.cc == 'gcc-14' && matrix.configuration == 'Release'
        run: |
          for b in AppDir/usr/bin/rwe AppDir/usr/bin/rwe_setup AppDir/usr/bin/rwe_bridge; do
            rpath=$(readelf -d "$b" | grep -E 'RUNPATH|RPATH' || true)
            echo "$b: ${rpath:-<none>}"
            case "$rpath" in
              *'$ORIGIN'*) ;;
              *) echo "::error::$b has no ORIGIN rpath; with no LD_LIBRARY_PATH it cannot find its bundled libraries" ; exit 1 ;;
            esac
          done
      - name: upload AppImage artifact
        if: matrix.cc == 'gcc-14' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: RWE AppImage
          path: Robot_War_Engine-*.AppImage
          if-no-files-found: error

  build-windows-msvc:
    # Two questions, and both must pass. Which label was just added, if
    # this was a label at all -- only ci:full starts anything, so putting
    # any other label on a pull request that already carries ci:full does
    # not set the Windows matrix going again. And then the ordinary one:
    # is this a push, or a pull request that asked for the full matrix.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
      && (github.event_name != 'pull_request'
          || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    # A job that hangs should fail in a reasonable time rather than
    # hold a runner for GitHub's six-hour default: on 2026-09-06 a
    # modal assertion dialog in the MSVC Debug test run sat for two
    # hours and eighteen minutes before it was cancelled by hand.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: init submodules (shallow)
        run: git submodule update --init --recursive --depth 1
      - name: install node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: install npm packages
        working-directory: launcher
        run: npm ci
      # CPack installs launcher/rwe-launcher-win32-x64/, so the packaged
      # launcher is a build input here, not a check. The checks live in the
      # `launcher` job.
      - name: package launcher
        working-directory: launcher
        run: npm run package
      - run: python3 fetch-msvc-libs.py
      - name: install tools
        run: choco install sccache nsis -y
      - name: restore sccache
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: sccache-${{ runner.os }}-msvc-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-msvc-${{ matrix.configuration }}-
      - name: build rwe
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ..
          cmake --build . --config ${{ matrix.configuration }} --parallel 4
          cd ..
      - name: test rwe
        working-directory: build
        env:
          RWE_TEST_ANNOUNCE: 1
        run: .\${{ matrix.configuration }}\rwe_test.exe --durations yes
      # Release only: nothing downloads a Debug installer -- the release job
      # takes the MSVC Release pair and the AppImage -- and building one costs
      # about four minutes a job.
      - name: package rwe
        if: matrix.configuration == 'Release'
        working-directory: build
        run: cmake --build . --target package --config ${{ matrix.configuration }} --parallel 4
      - name: upload zip artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: RWE Zip ${{ runner.os }} MSVC ${{ matrix.configuration }}
          path: build/dist/RobotWarEngine-*-Windows-${{ matrix.configuration }}.zip
          if-no-files-found: error
      - name: upload installer artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: RWE Installer ${{ runner.os }} MSVC ${{ matrix.configuration }}
          path: build/dist/RobotWarEngine-*-Windows-${{ matrix.configuration }}.exe
          if-no-files-found: error

  build-windows-mingw64:
    # Two questions, and both must pass. Which label was just added, if
    # this was a label at all -- only ci:full starts anything, so putting
    # any other label on a pull request that already carries ci:full does
    # not set the Windows matrix going again. And then the ordinary one:
    # is this a push, or a pull request that asked for the full matrix.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
      && (github.event_name != 'pull_request'
          || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    # A job that hangs should fail in a reasonable time rather than
    # hold a runner for GitHub's six-hour default: on 2026-09-06 a
    # modal assertion dialog in the MSVC Debug test run sat for two
    # hours and eighteen minutes before it was cancelled by hand.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: init submodules (shallow)
        run: git submodule update --init --recursive --depth 1
      - name: install node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: install npm packages
        working-directory: launcher
        run: npm ci
      - name: package launcher
        working-directory: launcher
        run: npm run package
      - name: install nsis
        run: choco install nsis -y
      # Third-party actions are pinned to a commit rather than a tag, which
      # its owner can move. Bump the hash and the comment together. Issue #75.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            autoconf
            automake
            libtool
            make
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-ccache
      - name: restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-mingw64-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-mingw64-${{ matrix.configuration }}-
      # `git rev-parse HEAD:libs/protobuf` is the gitlink SHA the superproject
      # records, so it names the exact protobuf the build is about to compile.
      # It is read here rather than hashed with hashFiles, whose globs do not
      # reliably descend into .git -- a miss there returns an empty string and
      # collapses the key to a constant without saying so.
      - name: identify protobuf version
        id: protobuf-version
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:libs/protobuf)" >> "$GITHUB_OUTPUT"
      - name: restore protobuf
        id: cache-protobuf-restore
        uses: actions/cache/restore@v5
        with:
          path: libs/_protobuf-install
          key: ${{ runner.os }}-mingw64-protobuf-${{ steps.protobuf-version.outputs.sha }}-${{ hashFiles('libs/build-protobuf.sh') }}
      - name: build protobuf
        working-directory: libs
        run: ./build-protobuf.sh
        shell: msys2 {0}
      - name: save protobuf
        id: cache-protobuf-save
        if: steps.cache-protobuf-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: libs/_protobuf-install
          key: ${{ steps.cache-protobuf-restore.outputs.cache-primary-key }}
      - name: build rwe
        run: |
          mkdir build
          pushd build
          cmake -G 'Unix Makefiles' -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DRWE_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
          make -j 4
          popd
        shell: msys2 {0}
      # Debug only, and only here: the section ceiling is a COFF limit and it
      # is Debug that pays it -- Release folds the template instantiations away
      # and comes nowhere near. This is also the job whose linker actually
      # broke over it, so this is the job that guards it.
      - name: section budget
        if: matrix.configuration == 'Debug'
        run: ./tools/section-budget.sh build 75
        shell: msys2 {0}
      - name: test rwe
        working-directory: build
        env:
          RWE_TEST_ANNOUNCE: 1
        run: ./rwe_test --durations yes
        shell: msys2 {0}
      # Release only: nothing downloads a Debug installer -- the release job
      # takes the MSVC Release pair and the AppImage -- and building one costs
      # about four minutes a job.
      - name: package rwe
        if: matrix.configuration == 'Release'
        working-directory: build
        run: make package
        shell: msys2 {0}
      - name: upload zip artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: RWE Zip ${{ runner.os }} MinGW64 ${{ matrix.configuration }}
          path: build/dist/RobotWarEngine-*-Windows-${{ matrix.configuration }}.zip
          if-no-files-found: error
      - name: upload installer artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: RWE Installer ${{ runner.os }} MinGW64 ${{ matrix.configuration }}
          path: build/dist/RobotWarEngine-*-Windows-${{ matrix.configuration }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [launcher, build-linux, build-windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # These two actions sit on their Node 24 majors because GitHub takes Node 20
    # off the runners on 2026-09-23; for what we ask of them, nothing else moved.
    steps:
      - name: download MSVC Release zip
        uses: actions/download-artifact@v7
        with:
          name: RWE Zip Windows MSVC Release
          path: dist
      - name: download MSVC Release installer
        uses: actions/download-artifact@v7
        with:
          name: RWE Installer Windows MSVC Release
          path: dist
      - name: download AppImage
        uses: actions/download-artifact@v7
        with:
          name: RWE AppImage
          path: dist
      - name: create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # A -preN tag is a pre-release, so GitHub should say so and should
          # not move the "Latest" badge onto it. The tag name is the caller's:
          # a called workflow's github context is the caller's throughout, so
          # github.ref_name here is the tag release.yml was pushed for.
          prerelease: ${{ contains(github.ref_name, '-pre') }}

  # A rolling pre-release of the newest `revival` build, so the community can
  # playtest without waiting for a version tag. One release under a fixed
  # `nightly` tag, its three assets replaced on every push: the tag is moved to
  # the built commit so it names the revision, and the body says which hash it
  # is and what changed since the previous nightly. The tag is lightweight on
  # purpose -- CMake's `git describe` sees only annotated tags, so it never
  # leaks into the version the binaries report.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/revival'
    needs: [launcher, build-linux, build-windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags: the notes are the commits since the last
          # nightly, and that commit is read back from the `nightly` tag.
          fetch-depth: 0
      - name: download MSVC Release zip
        uses: actions/download-artifact@v7
        with:
          name: RWE Zip Windows MSVC Release
          path: dist
      - name: download MSVC Release installer
        uses: actions/download-artifact@v7
        with:
          name: RWE Installer Windows MSVC Release
          path: dist
      - name: download AppImage
        uses: actions/download-artifact@v7
        with:
          name: RWE AppImage
          path: dist
      # Read before the tag moves, so the range is the commits since the last
      # nightly rather than since the last version tag, which only grows.
      - name: write release notes
        id: notes
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          old=$(git rev-parse -q --verify refs/tags/nightly || true)
          {
            echo "Rolling playtest build of \`revival\`."
            echo
            echo "**Commit:** [\`$sha\`](https://github.com/${{ github.repository }}/commit/$sha)"
            echo
            echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            if [ -z "$old" ]; then
              echo "_First nightly build._"
            elif [ "$old" = "$sha" ]; then
              echo "_Rebuild of the same commit._"
            else
              echo "### Changes since the previous nightly"
              echo
              git log --no-merges --pretty='- %s (%h)' "$old..HEAD"
            fi
          } > "$RUNNER_TEMP/nightly-notes.md"
      - name: move nightly tag
        shell: bash
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
      # The release is identified by its tag and each asset's name carries the
      # commit (`git describe`), so every build's files have new names. The
      # upload only overwrites identical names, so without this the rolling
      # release would accumulate one set of assets per commit.
      - name: clear previous nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Nothing to clear before the first nightly exists, and saying so
          # is not optional: the step runs under `-e -o pipefail`, so
          # `gh release view` failing took the whole job down -- before the
          # step that would have created the release it was looking for. The
          # notes step above already handles a first run; this one did not,
          # which is why the first real nightly never published.
          #
          # The tag is not the test. `move nightly tag` runs before this, so
          # by now refs/tags/nightly exists whether or not anything has ever
          # been released against it.
          if ! gh release view nightly >/dev/null 2>&1; then
            echo "no previous nightly release; nothing to clear"
            exit 0
          fi
          gh release view nightly --json assets --jq '.assets[].name' \
            | while IFS= read -r asset; do
                gh release delete-asset nightly "$asset" --yes
              done
      - name: publish nightly pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: Nightly ${{ steps.notes.outputs.short }}
          target_commitish: ${{ github.sha }}
          # Published rather than draft so the community can download it, and a
          # pre-release so it never takes the "Latest" badge from a real one.
          prerelease: true
          make_latest: "false"
          body_path: ${{ runner.temp }}/nightly-notes.md
          files: dist/*
          fail_on_unmatched_files: true
